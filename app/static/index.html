<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Roomly — учётная запись</title><link rel="stylesheet" href="/account/style.css"></head>
<body><main><h1>Roomly</h1><p id="message" role="status" aria-live="polite"></p>
<section id="login-section"><h2>Вход</h2><form id="login"><label>Почта <input name="email" type="email" required autocomplete="username"></label><label>Пароль <input name="password" type="password" required autocomplete="current-password"></label><button>Войти</button></form></section>
<section id="account-section" hidden><h2>Учётная запись</h2><p id="identity"></p><button id="logout">Выйти</button><h3>Изменить пароль</h3><form id="password"><label>Текущий пароль <input name="current_password" type="password" required autocomplete="current-password"></label><label>Новый пароль <input name="new_password" type="password" minlength="12" required autocomplete="new-password"></label><button>Изменить пароль</button></form>
<section id="resources-section"><h3>Офисы и ресурсы</h3>
<label>Офис <select id="office-picker" aria-label="Выбор офиса"></select></label>
<h4>Комнаты</h4><ul id="room-list"></ul><h4>Оборудование</h4><ul id="equipment-list"></ul>
</section>
<section id="resources-admin" hidden><h3>Управление офисами</h3>
<form id="office-form"><label>Существующий офис <select name="id"><option value="">Новый офис</option></select></label>
<label>Название офиса <input name="name" required maxlength="120"></label><label>Часовой пояс IANA <input name="timezone" required maxlength="64" placeholder="Europe/London"></label><label><span>Офис активен</span><input name="active" type="checkbox" checked></label><button>Сохранить офис</button></form>
<h3>Управление комнатами выбранного офиса</h3><form id="room-form"><label>Существующая комната <select name="id"><option value="">Новая комната</option></select></label><label>Название комнаты <input name="name" required maxlength="120"></label><label>Размер комнаты <select name="category"><option value="small">Малая</option><option value="medium">Средняя</option><option value="large">Большая</option></select></label><label>Вместимость <input name="capacity" type="number" min="1" required></label><label><span>Комната активна</span><input name="active" type="checkbox" checked></label><button>Сохранить комнату</button></form>
<h3>Управление оборудованием выбранного офиса</h3><form id="equipment-form"><label>Существующее оборудование <select name="id"><option value="">Новое оборудование</option></select></label><label>Обозначение оборудования <input name="label" required maxlength="120"></label><label>Тип оборудования <select name="type"><option value="projector">Проектор</option><option value="speakerphone">Громкая связь</option></select></label><label><span>Оборудование активно</span><input name="active" type="checkbox" checked></label><button>Сохранить оборудование</button></form></section>
<section id="admin-section" hidden><h3>Создать пользователя</h3><form id="create-user"><label>Имя <input name="display_name" required></label><label>Почта <input name="email" type="email" required></label><label>Пароль <input name="password" type="password" minlength="12" required autocomplete="new-password"></label><label>Роль <select name="role"><option value="user">Пользователь</option><option value="admin">Администратор</option></select></label><button>Создать</button></form><h3>Пользователи</h3><ul id="user-list"></ul><h3>Сбросить пароль</h3><form id="reset-password"><label>Номер пользователя <input name="user_id" type="number" min="1" required></label><label>Новый пароль <input name="password" type="password" minlength="12" required autocomplete="new-password"></label><button>Сбросить пароль</button></form></section></section></main><script src="/account/account.js"></script></body></html>
